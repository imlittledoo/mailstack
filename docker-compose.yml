name: mailstack

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-dns: &dns
  dns:
    - ${IPV4_NETWORK:-172.22.1}.254

services:
  unbound:
    build: ./services/unbound
    image: mailstack/unbound:latest
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-UTC}
      IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
      DNS_FORWARDERS: ${DNS_FORWARDERS:-}
    networks:
      mailstack:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.254
    logging: *logging

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_DATABASE: ${DB_NAME:-mailstack}
      MARIADB_USER: ${DB_USER:-mailstack}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - run ./mailstack.sh init}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is not set - run ./mailstack.sh init}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [mailstack]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [mailstack]
    logging: *logging

  acme:
    build: ./services/acme
    image: mailstack/acme:latest
    restart: unless-stopped
    init: true
    <<: *dns
    environment:
      TZ: ${TZ:-UTC}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:?MAIL_HOSTNAME is not set - run ./mailstack.sh init}
      ADDITIONAL_SAN: ${ADDITIONAL_SAN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-n}
      SKIP_LETSENCRYPT: ${SKIP_LETSENCRYPT:-n}
    volumes:
      - certs:/etc/ssl/mail
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    networks: [mailstack]
    logging: *logging

  admin:
    build: ./services/admin
    image: mailstack/admin:latest
    restart: unless-stopped
    <<: *dns
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-mailstack}
      DB_USER: ${DB_USER:-mailstack}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is not set - run ./mailstack.sh init}
      API_KEY: ${API_KEY:-}
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD}
      DOVEADM_API_KEY: ${DOVEADM_API_KEY}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-dkim}
      DKIM_KEY_BITS: ${DKIM_KEY_BITS:-2048}
      MTA_STS_MODE: ${MTA_STS_MODE:-testing}
      PUBLIC_IPV4: ${PUBLIC_IPV4:-}
      PUBLIC_IPV6: ${PUBLIC_IPV6:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - dkim:/var/lib/dkim
    networks: [mailstack]
    logging: *logging

  rspamd:
    build: ./services/rspamd
    image: mailstack/rspamd:latest
    restart: unless-stopped
    init: true
    <<: *dns
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD:?RSPAMD_PASSWORD is not set - run ./mailstack.sh init}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - rspamd:/var/lib/rspamd
      - dkim:/var/lib/dkim
    networks: [mailstack]
    logging: *logging

  dovecot:
    build: ./services/dovecot
    image: mailstack/dovecot:latest
    restart: unless-stopped
    init: true
    <<: *dns
    depends_on:
      admin:
        condition: service_healthy
      acme:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-mailstack}
      DB_USER: ${DB_USER:-mailstack}
      DB_PASSWORD: ${DB_PASSWORD}
      DOVEADM_API_KEY: ${DOVEADM_API_KEY:?DOVEADM_API_KEY is not set - run ./mailstack.sh init}
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD}
    volumes:
      - vmail:/var/vmail
      - certs:/etc/ssl/mail:ro
    ports:
      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"
      - "${POP3_PORT:-110}:110"
      - "${POP3S_PORT:-995}:995"
      - "${SIEVE_PORT:-4190}:4190"
    networks: [mailstack]
    logging: *logging

  postfix:
    build: ./services/postfix
    image: mailstack/postfix:latest
    restart: unless-stopped
    init: true
    <<: *dns
    depends_on:
      admin:
        condition: service_healthy
      acme:
        condition: service_healthy
      dovecot:
        condition: service_started
      rspamd:
        condition: service_started
    environment:
      TZ: ${TZ:-UTC}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-mailstack}
      DB_USER: ${DB_USER:-mailstack}
      DB_PASSWORD: ${DB_PASSWORD}
      MESSAGE_SIZE_LIMIT_MB: ${MESSAGE_SIZE_LIMIT_MB:-50}
      RELAYHOST: ${RELAYHOST:-}
      RELAYHOST_USER: ${RELAYHOST_USER:-}
      RELAYHOST_PASSWORD: ${RELAYHOST_PASSWORD:-}
    volumes:
      - postfix-queue:/var/spool/postfix
      - certs:/etc/ssl/mail:ro
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SMTPS_PORT:-465}:465"
      - "${SUBMISSION_PORT:-587}:587"
    networks: [mailstack]
    logging: *logging

  webmail:
    build: ./services/webmail
    image: mailstack/webmail:latest
    restart: unless-stopped
    depends_on:
      - dovecot
      - postfix
    environment:
      TZ: ${TZ:-UTC}
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://postfix
      ROUNDCUBEMAIL_SMTP_PORT: "465"
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve,markasjunk,newmail_notifier
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: ${MESSAGE_SIZE_LIMIT_MB:-50}M
    volumes:
      - roundcube-db:/var/roundcube/db
    networks: [mailstack]
    logging: *logging

  radicale:
    build: ./services/radicale
    image: mailstack/radicale:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - radicale:/data
    networks: [mailstack]
    logging: *logging

  nginx:
    build: ./services/nginx
    image: mailstack/nginx:latest
    restart: unless-stopped
    init: true
    depends_on:
      acme:
        condition: service_healthy
      admin:
        condition: service_started
      webmail:
        condition: service_started
      radicale:
        condition: service_started
    environment:
      TZ: ${TZ:-UTC}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      MESSAGE_SIZE_LIMIT_MB: ${MESSAGE_SIZE_LIMIT_MB:-50}
    volumes:
      - certs:/etc/ssl/mail:ro
      - acme-webroot:/var/www/acme:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [mailstack]
    logging: *logging

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: [clamav]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - clamav:/var/lib/clamav
    networks: [mailstack]
    logging: *logging

networks:
  mailstack:
    driver: bridge
    ipam:
      config:
        - subnet: ${IPV4_NETWORK:-172.22.1}.0/24

volumes:
  mariadb:
  redis:
  certs:
  letsencrypt:
  acme-webroot:
  dkim:
  rspamd:
  vmail:
  postfix-queue:
  roundcube-db:
  radicale:
  clamav:
