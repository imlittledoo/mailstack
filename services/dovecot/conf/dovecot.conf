# MailStack Dovecot 2.3 configuration.
# Secrets and host-specific values live in secrets.conf / dovecot-sql.conf.ext (written by the entrypoint).

protocols = imap pop3 lmtp sieve
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes
auth_mechanisms = plain login
auth_username_format = %Lu
auth_failure_delay = 2 secs
disable_plaintext_auth = yes

# --- Mail storage -------------------------------------------------------
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins = $mail_plugins quota
mail_max_userip_connections = 50
recipient_delimiter = +
lmtp_save_to_detail_mailbox = no
mail_attribute_dict = file:%h/Maildir/dovecot-attributes

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# --- TLS ----------------------------------------------------------------
ssl = required
ssl_cert = </etc/ssl/mail/cert.pem
ssl_key = </etc/ssl/mail/key.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = no

# --- Users (MariaDB) ----------------------------------------------------
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
# App passwords: tried when the mailbox password does not match. They are random,
# so they are stored as plain SHA-256 and matched directly in SQL (%w = the password).
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql-app.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# --- Services -----------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# SASL for Postfix (internal network only - not published).
service auth {
  inet_listener sasl {
    port = 12345
  }
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}

service auth-worker {
  user = $default_internal_user
}

# Postfix asks this service whether a recipient is over quota before accepting mail.
service quota-status {
  executable = quota-status -p postfix
  user = vmail
  client_limit = 1
  inet_listener quota-status {
    port = 12340
  }
}

# Doveadm HTTP API, used by the admin panel for quota usage.
service doveadm {
  inet_listener http {
    port = 8080
  }
}

# --- Protocols ----------------------------------------------------------
protocol imap {
  mail_plugins = $mail_plugins imap_quota imap_sieve
  mail_max_userip_connections = 50
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@%d
}

protocol pop3 {
  pop3_uidl_format = %08Xu%08Xv
}

# --- Plugins ------------------------------------------------------------
plugin {
  quota = count:User quota
  quota_vsizes = yes
  quota_grace = 10%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"

  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_before = /etc/dovecot/sieve/before.d/
  sieve_plugins = sieve_imapsieve sieve_extprograms
  sieve_global_extensions = +vnd.dovecot.pipe +vnd.dovecot.environment
  sieve_pipe_bin_dir = /usr/local/lib/dovecot/sieve-pipe

  # Moving mail into Junk trains Rspamd as spam ...
  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY
  imapsieve_mailbox1_before = file:/etc/dovecot/sieve/learn-spam.sieve

  # ... and moving it out of Junk trains it as ham.
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/dovecot/sieve/learn-ham.sieve
}

!include_try /etc/dovecot/secrets.conf
