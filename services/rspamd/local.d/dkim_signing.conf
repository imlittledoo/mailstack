# Keys and selectors are managed by the admin panel (written to the shared "dkim" volume).
enabled = true;
sign_authenticated = true;
sign_local = false;
use_domain = "header";
use_esld = false;
# Postfix already enforces sender/login ownership (reject_authenticated_sender_login_mismatch),
# so mailboxes may sign for aliases and alias domains they own.
allow_username_mismatch = true;
allow_hdrfrom_mismatch = false;
try_fallback = false;
selector_map = "/var/lib/dkim/selectors.map";
path = "/var/lib/dkim/$domain.$selector.key";
